# Grow-tent air quality board (ESP32-WROOM-32, 30-pin devkit — flashed 2026-07-16, COM6/CP210x).
# 30-pin note: no GPIO16/17 on this board, fine here — the mux design only needs GPIO21/22.
# SCD41 CO2 + 4x SHT41 (temp/RH) behind a single TCA9548A I2C mux.
# All 4 SHT41 share address 0x44, so each gets its own mux channel for isolation
# (a shorted/dead sensor only takes out its channel, not the whole bus). SCD41 (0x62)
# doesn't address-clash with the SHT41s but shares the mux anyway for the same reason.
# TCA9548A address strap: A0/A1/A2 all to GND -> 0x70 (default, matches this config).
esphome:
  name: grow-tent-climate
  friendly_name: Grow Tent Climate

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret grow_tent_climate_api_key

ota:
  - platform: esphome
    password: !secret grow_tent_climate_ota_password

wifi:
  # Grow-area AP (GT784WN bridge @ 192.168.2.250) preferred; main router fallback.
  # Static IP set in-firmware because the router refuses DHCP reservations.
  networks:
    - ssid: !secret wifi_ssid_grow
      password: !secret wifi_password_grow
      priority: 10
      manual_ip:
        static_ip: 192.168.2.236
        gateway: 192.168.2.1
        subnet: 255.255.255.0
        dns1: 192.168.2.1
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 0
      manual_ip:
        static_ip: 192.168.2.236
        gateway: 192.168.2.1
        subnet: 255.255.255.0
        dns1: 192.168.2.1
  ap:
    ssid: "Grow-Tent-Climate AP"
    password: !secret grow_tent_climate_ap_password

captive_portal:

# ---- I2C: one physical bus -> TCA9548A mux -> one sensor per channel ----
i2c:
  - id: bus_main
    sda: GPIO21
    scl: GPIO22
    frequency: 50kHz
    scan: true

tca9548a:
  - address: 0x70
    id: mux
    i2c_id: bus_main
    channels:
      - bus_id: mux_canopy
        channel: 0
      - bus_id: mux_flower
        channel: 1
      - bus_id: mux_stem
        channel: 2
      - bus_id: mux_controller
        channel: 3
      - bus_id: mux_co2
        channel: 4

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  # ---- SHT41 x4 (temp + RH at 4 positions), each isolated on its own mux channel ----
  # ch0 Canopy / ch1 Flower / ch2 Stem = the three plant-zone heights; all three feed
  # sensor.tent_average_temperature / _humidity in HA via area=tent auto-discovery.
  # ch3 Controller measures the control-board enclosure, NOT tent air -- it is
  # deliberately EXCLUDED from those averages (two bucks self-heat it, so it reads
  # high) and instead drives the controller over-temp / over-humidity alerts.
  # (ch0 was named "Lights" until 2026-07-29; renamed before mounting.)
  #
  # FILTERING (added 2026-08-05). These published raw, unrounded floats every
  # 30 s -- 13 decimal places, 10 values, ~29k recorder rows/day from this board
  # alone, and every single publish counted as a state CHANGE because no two
  # raw samples are ever bit-identical. All outlier rejection was happening
  # HA-side in the tent-average templates; the board itself did nothing.
  #   round: 2 -> the filter that actually TRUNCATES THE PUBLISHED VALUE to
  #     sensor-honest precision (SHT41 is +/-0.2 C / +/-1.8 %RH, so digits past
  #     the 2nd are pure noise). Repeated rounded values then stop registering
  #     as state CHANGES in HA, which is where most of the recorder saving
  #     comes from.
  #     DO NOT swap this for accuracy_decimals alone -- that only sets DISPLAY
  #     precision (HA maps it to suggested_display_precision). The raw float
  #     still crosses the API and still lands in the recorder full-width.
  #     Verified the hard way 2026-08-05: a flash carrying accuracy_decimals
  #     but no round filter left states reading 22.1890316009521.
  #     Both are kept: round fixes the stored value, accuracy_decimals tells
  #     HA and the logs how many digits are meaningful.
  #   window 4 / send_every 2 -> still samples every 30 s, but publishes once a
  #     minute as the mean of the last 4 samples (2 min of data). Kills
  #     single-sample spikes at the source instead of relying on the HA median
  #     band to catch them. Order matters: average FIRST, then round, so the
  #     rounding applies to the smoothed value rather than to each sample.
  #   send_first_at: 1 -> publish the very first sample after boot, so HA is not
  #     blank for two minutes after every flash.
  # Costs up to ~1 min of latency, which is nothing against tent air's thermal
  # mass, the 30 C AC-boost threshold, and the 15-minute divergence hold.
  - platform: sht4x
    i2c_id: mux_canopy
    address: 0x44
    update_interval: 30s
    temperature:
      name: "Canopy Temperature"
      accuracy_decimals: 2
      filters:
        - sliding_window_moving_average:
            window_size: 4
            send_every: 2
            send_first_at: 1
        - round: 2
    humidity:
      name: "Canopy Humidity"
      accuracy_decimals: 2
      filters:
        - sliding_window_moving_average:
            window_size: 4
            send_every: 2
            send_first_at: 1
        - round: 2

  - platform: sht4x
    i2c_id: mux_flower
    address: 0x44
    update_interval: 30s
    temperature:
      name: "Flower Temperature"
      accuracy_decimals: 2
      filters:
        - sliding_window_moving_average:
            window_size: 4
            send_every: 2
            send_first_at: 1
        - round: 2
    humidity:
      name: "Flower Humidity"
      accuracy_decimals: 2
      filters:
        - sliding_window_moving_average:
            window_size: 4
            send_every: 2
            send_first_at: 1
        - round: 2

  - platform: sht4x
    i2c_id: mux_stem
    address: 0x44
    update_interval: 30s
    temperature:
      name: "Stem Temperature"
      accuracy_decimals: 2
      filters:
        - sliding_window_moving_average:
            window_size: 4
            send_every: 2
            send_first_at: 1
        - round: 2
    humidity:
      name: "Stem Humidity"
      accuracy_decimals: 2
      filters:
        - sliding_window_moving_average:
            window_size: 4
            send_every: 2
            send_first_at: 1
        - round: 2

  - platform: sht4x
    i2c_id: mux_controller
    address: 0x44
    update_interval: 30s
    temperature:
      name: "Controller Temperature"
      accuracy_decimals: 2
      filters:
        - sliding_window_moving_average:
            window_size: 4
            send_every: 2
            send_first_at: 1
        - round: 2
    humidity:
      name: "Controller Humidity"
      accuracy_decimals: 2
      filters:
        - sliding_window_moving_average:
            window_size: 4
            send_every: 2
            send_first_at: 1
        - round: 2

  # ---- SCD41 CO2 / temp / humidity, own mux channel (0x62) ----
  - platform: scd4x
    id: scd41_hub
    i2c_id: mux_co2
    address: 0x62
    update_interval: 30s
    # ASC = Automatic Self-Calibration. The sensor tracks the LOWEST CO2 it has seen over a
    # rolling ~7-day window and re-zeros itself so that minimum reads ~400ppm. That is only
    # valid if the sensor periodically breathes genuine ~420ppm OUTDOOR air.
    # THIS TENT NEVER DOES: intake is the LIVING ROOM, exhaust goes outside. An occupied
    # indoor space bottoms out at ~450-700ppm, so ASC would force that floor down to 400 and
    # bake in a permanent 50-300ppm UNDER-read -- the dangerous direction, since a dosing
    # automation would then overshoot chasing a target the sensor claims it hasn't hit.
    # => FALSE, permanently. Baseline is maintained by manual FRC instead: the sensor goes
    # outside in real fresh air at the start of every grow (before seedlings go in) and the
    # guarded "CO2 Force Recalibration" button is pressed there. Drift without ASC is only
    # tens of ppm/yr, so a per-grow FRC is comfortably more often than needed.
    # ASC lives in the SENSOR's own EEPROM and fresh SCD41s ship with it ON, so this is
    # flashed false BEFORE the replacement sensor is fitted -- it never runs a bad cycle.
    # Not runtime-toggleable in ESPHome; changing it is a one-line reflash.
    automatic_self_calibration: false
    # No pressure sensor on this board (cancelled by design), so compensate statically by
    # altitude instead -- NDIR ppm is density-dependent.
    # SITE ELEVATION = 30 m ASL (confirmed 2026-08-05). The old comment here guessed this
    # was worth "~1-2% accuracy"; at 30 m it is not. 30 m is ~1009.7 hPa vs 1013.25 at sea
    # level, a 0.36% pressure delta, so the correction is ~1.5 ppm at 420 ppm and ~5 ppm at
    # 1500 ppm -- far inside the SCD41's own +/-(40 ppm + 5%) spec. Set it for correctness,
    # but do NOT treat it as an accuracy lever; FRC in real outdoor air is what actually
    # matters here.
    # Left commented because the SCD41 is not fitted yet -- uncomment and reflash in the
    # same pass that mounts the replacement sensor, so config never leads firmware.
    # altitude_compensation: 30m
    co2:
      name: "Tent CO2"
      id: tent_climate_co2
    temperature:
      name: "Tent CO2 Temperature"
    humidity:
      name: "Tent CO2 Humidity"

number:
  # Reference concentration the Force Recalibration button calibrates TO.
  # Outdoor ambient is ~425ppm and climbs ~2.5ppm/yr, so nudge this up over time;
  # set it to the cylinder value instead if a calibration gas is ever used.
  - platform: template
    name: "CO2 Calibration Reference"
    id: co2_cal_reference
    optimistic: true
    restore_value: true
    initial_value: 425
    min_value: 350
    max_value: 2000
    step: 1
    unit_of_measurement: ppm
    icon: mdi:target
    entity_category: config
    mode: box

button:
  # FRC (Forced ReCalibration) tells the SCD41 "the air you are in RIGHT NOW is exactly
  # <reference> ppm" and rewrites its baseline to match. It is a one-tap footgun:
  # pressing it inside an occupied or enriched tent bakes in a permanent error.
  #
  # PROCEDURE: carry the sensor to genuinely fresh outdoor air, away from the house and
  # away from your own breath, leave it powered and measuring there for AT LEAST 3 minutes
  # (Sensirion's equilibration requirement), and only then press.
  #
  # The guard below refuses to fire when the live reading is >300ppm from the reference.
  # That window is wide enough for any plausible sensor drift but narrow enough to catch
  # the real mistake -- pressing while still sitting in tent air.
  - platform: template
    name: "CO2 Force Recalibration"
    entity_category: config
    icon: mdi:tune
    on_press:
      - if:
          condition:
            lambda: |-
              const float ref = id(co2_cal_reference).state;
              const float now = id(tent_climate_co2).state;
              return !std::isnan(now) && fabsf(now - ref) <= 300.0f;
          then:
            - logger.log:
                level: INFO
                format: "FRC: recalibrating to %.0f ppm (sensor was reading %.0f ppm)"
                args: ['id(co2_cal_reference).state', 'id(tent_climate_co2).state']
            - scd4x.perform_forced_calibration:
                value: !lambda 'return (int) id(co2_cal_reference).state;'
                id: scd41_hub
          else:
            - logger.log:
                level: WARN
                format: "FRC ABORTED: %.0f ppm is not within 300 of reference %.0f ppm -- not fresh air, or no reading yet. Calibration left unchanged."
                args: ['id(tent_climate_co2).state', 'id(co2_cal_reference).state']

text_sensor:
  - platform: wifi_info
    ssid:
      name: "WiFi SSID"
